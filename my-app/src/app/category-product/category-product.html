
<table border="1">
  <tbody *ngFor="let c of categories; let first = first">
    <tr *ngIf="first">
      <th>Ma Danh Muc</th>
      <th>Ten Danh Muc</th>
    </tr>
    <tr>
      <td>{{ c.Cateid }}</td>
      <td>{{ c.CateName }}</td>
    </tr>
    <tr>
      <td colspan="2">
        <table border="1">
          <thead>
            <tr>
              <th>Ma San Pham</th>
              <th>Ten San Pham</th>
              <th>Gia San Pham</th>
              <th>Picture</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let p of c.Products">
              <td>{{ p.ProductId }}</td>
              <td>{{ p.ProductName }}</td>
              <td>{{ p.Price }}</td>
              <td class="img-cell">
                <img [src]=p.Image [alt]="p.ProductName" width="100" height="100"/>
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
